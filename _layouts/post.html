---
layout: default
---
<article class="paper-page">
  <a class="back-link" href="{{ '/' | relative_url }}">← Paper reviews</a>
  <header class="paper-header">
    <p class="eyebrow">PAPER REVIEW · {{ page.date | date: "%Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="paper-deck">{{ page.description }}</p>{% endif %}
    <div class="paper-meta"><time>{{ page.date | date: "%Y.%m.%d" }}</time>{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</div>
  </header>
  <div class="paper-grid">
    <aside class="toc"><p>ON THIS PAGE</p><nav id="tocNav"></nav></aside>
    <div class="paper-content" id="paperContent">{{ content }}</div>
  </div>
</article>
